name: ADM-14 Expo Media Picker Gate

on:
  push:
    branches:
      - agent/adm14-media-picker

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Update dependencies
        run: bun install

      - name: Format authored changes
        run: bun run format

      - name: Apply strict lint fixes
        run: bun run lint:fix

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Knip
        run: bun run knip

      - name: Generate documentation
        run: bun run docs

      - name: Format generated documentation
        run: bun run format

      - name: Validate repository conventions
        run: bunx @ankhorage/doctor@0.8.0 validate .

      - name: Verify formatting
        run: bun run format:check

      - name: Verify lint
        run: bun run lint

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Guard transient URI boundary
        run: |
          if grep -n -E 'readonly uri:|readonly uri\?' src/mediaPicker/types.ts; then
            echo 'Public media picker selection must not expose transient URIs.'
            exit 1
          fi

      - name: Verify changeset
        run: bun run changeset:status

      - name: Verify clean patches
        run: git diff --check

      - name: Commit validated non-workflow state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows/*'
          if ! git diff --cached --quiet; then
            git commit -m 'Validate ADM-14 Expo media picker'
            git push origin HEAD:agent/adm14-media-picker
          fi
