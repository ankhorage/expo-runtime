name: ADM-14 Bundled Media Subpath Gate

on:
  push:
    branches:
      - agent/adm14-bundled-media-subpath

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Add bundled-media package export
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.exports['./bundled-media'] = {
            'react-native': './src/bundledMedia/index.ts',
            browser: './src/bundledMedia/index.ts',
            types: './src/bundledMedia/index.ts',
            import: './dist/bundledMedia/index.js',
            default: './dist/bundledMedia/index.js',
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Add release metadata
        run: |
          cat > .changeset/adm14-bundled-media-subpath.md <<'EOF'
          ---
          '@ankhorage/expo-runtime': patch
          ---

          Expose bundled media resolution and registry generation through a lightweight bundled-media subpath.
          EOF
          cat > docs/bundled-media.md <<'EOF'
          # Bundled media

          Expo Runtime owns the Expo/Metro-specific resolution boundary for canonical bundled media.

          A manifest keeps only the app-relative canonical source, for example `{ kind: 'bundled', path: 'assets/authoring/hero/hero.png' }`.

          Consumers that only need bundled media should import `@ankhorage/expo-runtime/bundled-media`. This lightweight subpath exports the resolver, registry types and static registry source generator without loading the root Expo runtime/provider barrel. Node-based generators such as the Studio trusted host can therefore generate Metro asset registries without pulling React Native UI peers into their process.

          Metro cannot resolve an arbitrary runtime string with a dynamic `require()`. Generated Expo app code therefore creates a static `ExpoBundledMediaRegistry` whose values come from literal `require('../../assets/...')` expressions. `getExpoBundledMediaRegistrySource()` renders that static module and its generated type import also targets the lightweight bundled-media subpath.

          `createExpoBundledMediaResolver()` resolves only bundled media. Unknown paths and non-bundled sources return `null`, allowing composition with provider-backed media resolution.

          Temporary picker URIs, host filesystem paths, provider credentials and signed storage URLs are never canonical bundled media identity.
          EOF

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format authored changes
        run: bun run format

      - name: Apply strict lint fixes
        run: bun run lint:fix

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Knip
        run: bun run knip

      - name: Generate documentation
        run: bun run docs

      - name: Format generated documentation
        run: bun run format

      - name: Verify formatting
        run: bun run format:check

      - name: Verify lint
        run: bun run lint

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Verify clean patches
        run: git diff --check

      - name: Commit validated state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows/adm14-bundled-media-subpath-gate.yml'
          if ! git diff --cached --quiet; then
            git commit -m 'Validate bundled media subpath'
          fi

      - name: Verify changeset
        run: bun run changeset:status

      - name: Push validated state
        run: git push origin HEAD:agent/adm14-bundled-media-subpath
