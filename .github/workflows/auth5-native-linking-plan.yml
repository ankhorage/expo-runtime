name: Auth5 native linking plan

on:
  push:
    branches:
      - agent/auth5-native-linking-plan

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auth5-native-linking-plan
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Resolve Contracts dependency
        run: |
          bun update @ankhorage/contracts --lockfile-only
          bun install --frozen-lockfile

      - name: Format and validate
        run: |
          bun run format
          bun run lint:fix
          bun run build
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
          bun run docs
          bun run format:check
          bun run changeset:status

      - name: Commit validated plan
        run: |
          rm .github/workflows/auth5-native-linking-plan.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Finalize native linking planning'
          git push origin HEAD:agent/auth5-native-linking-plan
