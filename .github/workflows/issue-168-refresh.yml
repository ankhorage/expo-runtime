name: Issue 168 Expo platform refresh

on:
  push:
    branches:
      - fix/168-expo-57-0-23

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh lockfile
        run: bun install
      - name: Validate Expo platform owner
        run: |
          bun test src/platform.test.ts
          bun run validate:expo-platform
          bun run validate:headless-platform
          bun run validate:packed-runtime
      - name: Finalize branch artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-168-refresh.yml
          git add bun.lock
          git commit -m 'chore: refresh Expo 57 platform artifacts'
          git push origin HEAD:fix/168-expo-57-0-23
