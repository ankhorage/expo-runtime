name: Reader migration lock sync
on:
  push:
    branches:
      - refactor/322-reader-ownership
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Refresh lock from released packages
        run: bun install
      - name: Commit canonical Bun lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(reader): synchronize released dependencies [skip ci]"
            git push origin HEAD:refactor/322-reader-ownership
          fi
