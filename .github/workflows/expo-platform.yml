name: Expo platform

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Expo platform compatibility
        run: bun run validate:expo-platform

      - name: Validate packed headless platform subpath
        run: bun run validate:headless-platform

      - name: Validate packed ZORA 3 runtime
        run: bun run validate:packed-runtime
