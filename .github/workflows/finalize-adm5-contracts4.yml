name: Finalize ADM 5 Contracts 4

on:
  push:
    branches:
      - agent/adm-5-contracts-4

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Upgrade canonical contracts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies['@ankhorage/contracts'] = '^4.0.2';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          cat > .changeset/adm-5-contracts-4.md <<'EOF'
          ---
          '@ankhorage/expo-runtime': major
          ---

          Consume the canonical Contracts 4 app-manifest boundary for Expo runtime planning.
          EOF

      - name: Refresh lockfile
        run: bun install

      - name: Format sources
        run: bun run format

      - name: Run build
        run: bun run build

      - name: Run lint
        run: bun run lint

      - name: Run format check
        run: bun run format:check

      - name: Run Knip
        run: bun run knip

      - name: Run tests
        run: bun run test

      - name: Run typecheck
        run: bun run typecheck

      - name: Generate docs
        run: bun run docs

      - name: Format generated docs
        run: bun run format

      - name: Run final format check
        run: bun run format:check

      - name: Prepare validated commit
        run: |
          rm .github/workflows/finalize-adm5-contracts4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: consume canonical contracts 4 manifest'

      - name: Check changeset
        run: bun run changeset:status

      - name: Push validated migration
        run: git push origin HEAD:agent/adm-5-contracts-4
