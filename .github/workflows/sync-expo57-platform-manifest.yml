name: Sync Expo 57 platform manifest

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/166-refresh-expo57-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Synchronize package metadata from EXPO_PLATFORM
        run: |
          cat > .tmp-sync-expo-platform.ts <<'BUN'
          import { EXPO_PLATFORM } from './src/platform';

          const packageJson = await Bun.file('package.json').json();
          const ownedPeers = [
            EXPO_PLATFORM.runtime.expo,
            EXPO_PLATFORM.runtime.react,
            EXPO_PLATFORM.runtime.reactNative,
            EXPO_PLATFORM.packages.camera,
            EXPO_PLATFORM.packages.constants,
            EXPO_PLATFORM.packages.documentPicker,
            EXPO_PLATFORM.packages.fileSystem,
            EXPO_PLATFORM.packages.font,
            EXPO_PLATFORM.packages.imagePicker,
            ...Object.values(EXPO_PLATFORM.ui.iconProviders),
          ];
          const devOnly = [
            EXPO_PLATFORM.runtime.reactDom,
            EXPO_PLATFORM.runtime.reactNativeWeb,
            EXPO_PLATFORM.navigation.safeArea,
            EXPO_PLATFORM.tooling.nodeTypes,
            EXPO_PLATFORM.tooling.reactTypes,
            EXPO_PLATFORM.tooling.typescript,
          ];

          for (const dependency of ownedPeers) {
            packageJson.peerDependencies[dependency.name] = dependency.version;
            packageJson.devDependencies[dependency.name] = dependency.version;
          }
          for (const dependency of devOnly) {
            packageJson.devDependencies[dependency.name] = dependency.version;
          }

          await Bun.write('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          BUN
          bun .tmp-sync-expo-platform.ts
          rm .tmp-sync-expo-platform.ts
          bun install

      - name: Commit only synchronized manifest and lockfile
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo 'Package metadata and lockfile are already current.'
            exit 0
          fi

          if test -n "$(git diff --name-only | grep -Ev '^(package.json|bun.lock)$')"; then
            echo 'Synchronization changed unexpected files.' >&2
            git status --short
            exit 1
          fi

          git config user.name 'ankhorage-platform-sync[bot]'
          git config user.email 'ankhorage-platform-sync[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git commit -m 'chore: synchronize Expo 57 package metadata'
          git push origin HEAD:${{ github.head_ref }}
